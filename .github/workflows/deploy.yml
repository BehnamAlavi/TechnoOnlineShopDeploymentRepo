name: Build, Push to GHCR, and Deploy to VPS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      techno_version:
        description: "Techno-API version"
        required: true
        default: "1.0.0"

      controlpanel_version:
        description: "ControlPanel API version"
        required: true
        default: "1.0.0"

      frontend_version:
        description: "Frontend version"
        required: true
        default: "1.0.0"
env:
  REGISTRY: ghcr.io
  TECHNO_API_VERSION: ${{ github.event.inputs.techno_version }}
  CONTROLPANEL_API_VERSION: ${{ github.event.inputs.controlpanel_version }}
  FRONTEND_VERSION: ${{ github.event.inputs.frontend_version }}
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}
  VPS_APP_PATH: /opt/techno-shop
  DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "https://github-actions[bot]:${{ secrets.DEPLOYMENT_PAT }}@github.com" > ~/.git-credentials
          git config --global credential.helper store

      - name: Clone Backend Repository
        run: |
          git clone https://github.com/BehnamAlavi/TechnoOnlineShop backend-repo
          cd backend-repo
          git branch -a
          git checkout $(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')

      - name: Clone ControlPanel Repository
        run: |
          git clone https://github.com/BehnamAlavi/ControlPanel.TechnoOnlineShop controlpanel-repo
          cd controlpanel-repo
          git branch -a
          git checkout $(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')

      - name: Clone Frontend Repository
        run: |
          git clone https://github.com/BehnamAlavi/TechnoOnlineShop frontend-repo
          cd frontend-repo
          git branch -a
          git checkout $(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
          ls -la

      - name: Get repository owner (lowercase)
        id: repo-owner
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$REPO_OWNER" >> $GITHUB_OUTPUT

      - name: Validate backend structure
        run: |
          echo "Checking backend structure..."
          ls -la ./backend-repo/backend/
          ls -la ./backend-repo/backend/TechnoOnlineShop.Api/
          echo "Checking project files..."
          find ./backend-repo/backend -name "*.csproj" -type f
          echo "Backend validation complete!"

      - name: Build and push Techno API
        uses: docker/build-push-action@v7
        with:
          context: ./backend-repo/backend
          file: ./backend-repo/backend/TechnoOnlineShop.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}/technoshoponlinedeploy/techno-api:${{ env.TECHNO_API_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push ControlPanel API
        uses: docker/build-push-action@v7
        with:
          context: ./controlpanel-repo
          file: ./controlpanel-repo/ControlPanel.TechnoOnlineShop.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}/technoshoponlinedeploy/controlpanel-api:${{ env.CONTROLPANEL_API_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-repo/frontend/techno-shop-online
          file: ./frontend-repo/frontend/techno-shop-online/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}/technoshoponlinedeploy/frontend:${FRONTEND_VERSION}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Prepare variables
        run: |
           echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.VPS_PORT }} ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create VPS directories
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          set -e
          sudo mkdir -p ${{ env.VPS_APP_PATH }}
          sudo mkdir -p ${{ env.VPS_APP_PATH }}/data/categories
          sudo mkdir -p ${{ env.VPS_APP_PATH }}/data/products
          sudo mkdir -p ${{ env.VPS_APP_PATH }}/data/productalbum
          echo "✓ Directories created"
          EOF

      - name: Transfer docker-compose.yml
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} \
            docker-compose.yml ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_APP_PATH }}/

      - name: Transfer nginx.conf
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} \
            nginx.conf ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_APP_PATH }}/

      - name: Transfer database initialization
        run: |
          if [ -f init.sql ]; then
            scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} \
              init.sql ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_APP_PATH }}/
          else
            echo "init.sql not found, using backup.text if available"
            if [ -f backup.text ]; then
              scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} \
                backup.text ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_APP_PATH }}/init.sql
            fi
          fi

      - name: Create .env file on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << EOF
          set -e
          #REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat > ${{ env.VPS_APP_PATH }}/.env << ENVEOF
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          REGISTRY_OWNER=${REPO_OWNER}
          TECHNO_API_VERSION=${{ env.TECHNO_API_VERSION }}
          CONTROLPANEL_API_VERSION=${{ env.CONTROLPANEL_API_VERSION }}
          FRONTEND_VERSION=${{ env.FRONTEND_VERSION }}
          VPS_HOST=${{ env.VPS_HOST }}
          NODE_ENV=production
          ASPNETCORE_ENVIRONMENT=Production
          ENVEOF
          chmod 600 ${{ env.VPS_APP_PATH }}/.env
          echo "✓ .env file created"
          EOF

      - name: Login to GHCR and pull images
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}
          cd ${{ env.VPS_APP_PATH }}
          docker compose pull
          echo "✓ Images pulled successfully"
          EOF

      - name: Deploy services
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          set -e
          cd ${{ env.VPS_APP_PATH }}
          docker compose down || true
          docker compose up -d
          sleep 10
          echo "✓ Services deployed"
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          set -e
          echo "=========================================="
          echo "Deployment Verification"
          echo "=========================================="
          cd ${{ env.VPS_APP_PATH }}
          echo ""
          echo "Docker Compose Status:"
          docker compose ps
          echo ""
          echo "Health Check Summary:"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          echo ""
          echo "=========================================="
          echo "✓ Deployment completed successfully!"
          echo "=========================================="
          echo "Access Points:"
          echo "  Frontend: http://${{ env.VPS_HOST }}:3000"
          echo "  Techno API: http://${{ env.VPS_HOST }}:5001"
          echo "  ControlPanel API: http://${{ env.VPS_HOST }}:5002"
          echo "  Nginx Proxy: http://${{ env.VPS_HOST }}:1211"
          EOF
