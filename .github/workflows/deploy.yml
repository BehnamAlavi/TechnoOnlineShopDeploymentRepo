name: Build, Push to GHCR, and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}
  VPS_APP_PATH: /opt/techno-shop
  DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      techno-api-image: ${{ steps.image-names.outputs.techno-api }}
      controlpanel-api-image: ${{ steps.image-names.outputs.controlpanel-api }}
      frontend-image: ${{ steps.image-names.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: image-names
        run: |
          REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          echo "techno-api=${{ env.REGISTRY }}/$REPO_OWNER/$REPO_NAME/techno-api:1.0.0" >> $GITHUB_OUTPUT
          echo "controlpanel-api=${{ env.REGISTRY }}/$REPO_OWNER/$REPO_NAME/controlpanel-api:1.0.0" >> $GITHUB_OUTPUT
          echo "frontend=${{ env.REGISTRY }}/$REPO_OWNER/$REPO_NAME/frontend:1.0.0" >> $GITHUB_OUTPUT

      - name: Build and push Techno API
        uses: docker/build-push-action@v7
        with:
          context: ./repos/backend
          file: ./repos/backend/TechnoOnlineShop.Api/Dockerfile
          push: true
          tags: ${{ steps.image-names.outputs.techno-api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ControlPanel API
        uses: docker/build-push-action@v7
        with:
          context: ./repos/controlpanel
          file: ./repos/controlpanel/ControlPanel.TechnoOnlineShop.Api/Dockerfile
          push: true
          tags: ${{ steps.image-names.outputs.controlpanel-api }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./repos/frontend
          push: true
          tags: ${{ steps.image-names.outputs.frontend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.VPS_PORT }} ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create VPS directories
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          set -e
          mkdir -p ${{ env.VPS_APP_PATH }}
          mkdir -p ${{ env.VPS_APP_PATH }}/data/categories
          mkdir -p ${{ env.VPS_APP_PATH }}/data/products
          mkdir -p ${{ env.VPS_APP_PATH }}/data/productalbum
          echo "✓ Directories created"
          EOF

      - name: Transfer docker-compose.yml
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} \
            docker-compose.yml ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_APP_PATH }}/

      - name: Transfer nginx.conf
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} \
            nginx.conf ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_APP_PATH }}/

      - name: Transfer database initialization
        run: |
          if [ -f init.sql ]; then
            scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} \
              init.sql ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_APP_PATH }}/
          else
            echo "init.sql not found, using backup.text if available"
            if [ -f backup.text ]; then
              scp -i ~/.ssh/deploy_key -P ${{ env.VPS_PORT }} \
                backup.text ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_APP_PATH }}/init.sql
            fi
          fi

      - name: Create .env file on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat > ${{ env.VPS_APP_PATH }}/.env << 'ENVEOF'
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          REGISTRY_OWNER=${REPO_OWNER}
          TECHNO_API_VERSION=1.0.0
          CONTROLPANEL_API_VERSION=1.0.0
          FRONTEND_VERSION=1.0.0
          VPS_HOST=${{ env.VPS_HOST }}
          NODE_ENV=production
          ASPNETCORE_ENVIRONMENT=Production
          ENVEOF
          chmod 600 ${{ env.VPS_APP_PATH }}/.env
          echo "✓ .env file created"
          EOF

      - name: Login to GHCR and pull images
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}
          cd ${{ env.VPS_APP_PATH }}
          docker compose pull
          echo "✓ Images pulled successfully"
          EOF

      - name: Deploy services
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          set -e
          cd ${{ env.VPS_APP_PATH }}
          docker compose down || true
          docker compose up -d
          sleep 10
          echo "✓ Services deployed"
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF'
          set -e
          echo "=========================================="
          echo "Deployment Verification"
          echo "=========================================="
          cd ${{ env.VPS_APP_PATH }}
          echo ""
          echo "Docker Compose Status:"
          docker compose ps
          echo ""
          echo "Health Check Summary:"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          echo ""
          echo "=========================================="
          echo "✓ Deployment completed successfully!"
          echo "=========================================="
          echo "Access Points:"
          echo "  Frontend: http://${{ env.VPS_HOST }}:3000"
          echo "  Techno API: http://${{ env.VPS_HOST }}:5001"
          echo "  ControlPanel API: http://${{ env.VPS_HOST }}:5002"
          echo "  Nginx Proxy: http://${{ env.VPS_HOST }}:1211"
          EOF

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✓ Deployment to VPS succeeded"
            echo "Services:"
            echo "  - techno-api:1.0.0"
            echo "  - controlpanel-api:1.0.0"
            echo "  - frontend:1.0.0"
          else
            echo "✗ Deployment to VPS failed"
            exit 1
          fi
