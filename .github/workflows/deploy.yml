name: Build, Push to GHCR, and Deploy to VPS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      techno_version:
        description: "Techno-API version"
        required: true
        default: "1.0.0"

      controlpanel_version:
        description: "ControlPanel API version"
        required: true
        default: "1.0.0"

      frontend_version:
        description: "Frontend version"
        required: true
        default: "1.0.0"
env:
  REGISTRY: ghcr.io
  TECHNO_API_VERSION: ${{ github.event.inputs.techno_version }}
  CONTROLPANEL_API_VERSION: ${{ github.event.inputs.controlpanel_version }}
  FRONTEND_VERSION: ${{ github.event.inputs.frontend_version }}
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}
  VPS_APP_PATH: /opt/techno-shop
  DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "https://github-actions[bot]:${{ secrets.DEPLOYMENT_PAT }}@github.com" > ~/.git-credentials
          git config --global credential.helper store

      - name: Checkout Backend Repository
        uses: actions/checkout@v4.2.0
        with:
         repository: BehnamAlavi/TechnoOnlineShop
         ref: ${{ env.TECHNO_API_VERSION != '' && format('v{0}', env.TECHNO_API_VERSION) || 'main' }}
         path: backend-repo
         fetch-depth: 0
         token: ${{ secrets.DEPLOYMENT_PAT }}

      - name: Checkout ControlPanel Repository
        uses: actions/checkout@v4.2.0
        with:
          repository: BehnamAlavi/ControlPanel.TechnoOnlineShop
          ref: ${{ env.CONTROLPANEL_API_VERSION != '' && format('v{0}', env.CONTROLPANEL_API_VERSION) || 'main' }}
          path: controlpanel-repo
          fetch-depth: 0
          token: ${{ secrets.DEPLOYMENT_PAT }}
         
      - name: Checkout Frontend Repository
        uses: actions/checkout@v4.2.0
        with:
         repository: BehnamAlavi/TechnoOnlineShop
         ref: ${{ env.FRONTEND_VERSION != '' && format('v{0}', env.FRONTEND_VERSION) || 'main' }}
         path: frontend-repo
         fetch-depth: 0
         token: ${{ secrets.DEPLOYMENT_PAT }}

      - name: Debug Frontend Files
        run: |
          ls -la ./frontend-repo    
      - name: Get repository owner (lowercase)
        id: repo-owner
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$REPO_OWNER" >> $GITHUB_OUTPUT

      - name: Validate backend structure
        run: |
          echo "Checking backend structure..."
          ls -la ./backend-repo/backend/
          ls -la ./backend-repo/backend/TechnoOnlineShop.Api/
          echo "Checking project files..."
          find ./backend-repo/backend -name "*.csproj" -type f
          echo "Backend validation complete!"

      - name: Debug file locations
        run: |
           echo "Root:"
           ls -la ./backend-repo/backend

           echo "API folder:"
           ls -la ./backend-repo/backend/TechnoOnlineShop.Api

      - name: Build and push Techno API
        uses: docker/build-push-action@v7
        with:
          context: ./backend-repo/backend
          file: ./backend-repo/backend/TechnoOnlineShop.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}/technoshoponlinedeploy/techno-api:${{ env.TECHNO_API_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push ControlPanel API
        uses: docker/build-push-action@v7
        with:
          context: ./controlpanel-repo
          file: ./controlpanel-repo/ControlPanel.TechnoOnlineShop.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}/technoshoponlinedeploy/controlpanel-api:${{ env.CONTROLPANEL_API_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-repo/frontend/techno-shop-online
          file: ./frontend-repo/frontend/techno-shop-online/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.owner }}/technoshoponlinedeploy/frontend:${{ env.FRONTEND_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Prepare variables
        run: |
           echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up SSH with comprehensive debugging
        run: |
          set -x
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH key with explicit newlines
          echo "${{ env.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Verify key format
          echo "=== SSH Key Info ==="
          file ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          wc -l ~/.ssh/deploy_key
          
          # Add host to known_hosts
          echo "=== Adding host to known_hosts ==="
          ssh-keyscan -p ${{ env.VPS_PORT }} ${{ env.VPS_HOST }} 2>&1 || true
          ssh-keyscan -p ${{ env.VPS_PORT }} ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>&1 || true
          
          # Create SSH config
          cat > ~/.ssh/config << 'SSHCONFIG'
          Host deploy-vps
            HostName ${{ env.VPS_HOST }}
            User ${{ env.VPS_USER }}
            Port ${{ env.VPS_PORT }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 120
            BatchMode yes
            LogLevel VERBOSE
          SSHCONFIG
          
          chmod 600 ~/.ssh/config
          
          echo "=== SSH Config ==="
          cat ~/.ssh/config
          
          # Test SSH connection
          echo "=== Testing SSH connection ==="
          ssh -v deploy-vps "echo 'SSH Connection successful!' && exit 0" || {
            echo "SSH connection test failed with exit code $?"
            exit 1
          }

      - name: Login to GHCR and pull images
        run: |
          ssh -n deploy-vps bash -s << 'EOF'
          set -euo pipefail
          
          echo "Logging in to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ github.actor }}" \
            --password-stdin
          
          cd "${{ env.VPS_APP_PATH }}"
          echo "Pulling Docker images..."
          docker compose pull
          echo "✓ Images pulled successfully"
          EOF

      - name: Deploy services
        run: |
          ssh -n deploy-vps bash -s << 'EOF'
          set -e
          
          cd ${{ env.VPS_APP_PATH }}
          echo "Stopping existing services..."
          docker compose down || true
          
          echo "Starting services..."
          docker compose up -d
          
          sleep 10
          echo "✓ Services deployed"
          EOF

      - name: Verify deployment
        run: |
          ssh -n deploy-vps bash -s << 'EOF'
          set -e
          
          echo "=========================================="
          echo "Deployment Verification"
          echo "=========================================="
          
          cd ${{ env.VPS_APP_PATH }}
          
          echo ""
          echo "Docker Compose Status:"
          docker compose ps
          
          echo ""
          echo "Health Check Summary:"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          
          echo ""
          echo "=========================================="
          echo "✓ Deployment completed successfully!"
          echo "=========================================="
          echo "Access Points:"
          echo "  Frontend: http://${{ env.VPS_HOST }}:3000"
          echo "  Techno API: http://${{ env.VPS_HOST }}:5001"
          echo "  ControlPanel API: http://${{ env.VPS_HOST }}:5002"
          echo "  Nginx Proxy: http://${{ env.VPS_HOST }}:1211"
          EOF
