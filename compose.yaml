version: "3.9"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "1211:1211"
    volumes:
      - C:\techonline\nginx.conf:/etc/nginx/nginx.conf
      - C:\Users\ASUS\source\repos\Techno_Real\TechnoOnlineShop.ControlPanel\ControlPanel.TechnoOnlineShop.Api\wwwroot\Categories:/var/www/categories
      - C:\Users\ASUS\source\repos\Techno_Real\TechnoOnlineShop.ControlPanel\ControlPanel.TechnoOnlineShop.Api\wwwroot\Products:/var/www/products
      - C:\Users\ASUS\source\repos\Techno_Real\TechnoOnlineShop.ControlPanel\ControlPanel.TechnoOnlineShop.Api\wwwroot\ProductAlbum:/var/www/productalbum
    depends_on:
      - techno-api-service
      - controlpanel-api-service
      - frontend-service

  techno-api-service:
    build:
      context: C:\Users\ASUS\source\repos\BehnamAlavi\TechnoOnlineShop\backend
      dockerfile: TechnoOnlineShop.Api/Dockerfile
    image: techno-api:latest
    container_name: techno-api
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure:5

  controlpanel-api-service:
    build:
      context: C:\Users\ASUS\source\repos\Techno_Real\TechnoOnlineShop.ControlPanel
      dockerfile: ControlPanel.TechnoOnlineShop.Api/Dockerfile
    image: controlpanel-api:latest
    container_name: controlpanel-api
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5002:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure:5

  frontend-service:
    build:
      context: C:\Users\ASUS\source\repos\BehnamAlavi\TechnoOnlineShop\frontend\techno-shop-online
    image: frontend:latest
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://techno-api:5000

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: behiQAZ123!@#
      POSTGRES_DB: technoshopdb
    volumes:
      - C:\techonline\backup.text:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
