events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream techno_api {
        server techno-api:5000;
    }

    upstream controlpanel_api {
        server controlpanel-api:5000;
    }

    server {
        listen 1211;
        server_name _;

        # Static files
        location /img/categories/ {
            alias /var/www/categories/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        location /img/products/ {
            alias /var/www/products/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        location /img/prtalmb/ {
            alias /var/www/productalbum/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # ControlPanel API - /cpi/ stays as-is
        location ^~ /cpi/ {
            proxy_pass http://controlpanel_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }

        # TechnoOnlineShop API - /api/ is stripped, route goes to /tonlsite/...
        location ^~ /api/ {
            proxy_pass http://techno_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }

        # React frontend
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_redirect off;
        }
    }
}
