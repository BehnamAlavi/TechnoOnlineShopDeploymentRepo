events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;

    # Upstreams
    upstream frontend_upstream {
        server frontend:80;
    }

    upstream techno_api {
        server techno-api:5000;
    }

    upstream controlpanel_api {
        server controlpanel-api:5000;
    }

    # Catch ALL unmatched HTTP requests
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name technomarkazi110.ir www.technomarkazi110.ir;
        return 301 https://$host$request_uri;
    }

    # Catch ALL unmatched HTTPS requests
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/ssl/fullchain-dn.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey-dn.pem;

        return 444;
    }

    # Main HTTPS server
    server {
        listen 443 ssl;
        server_name technomarkazi110.ir www.technomarkazi110.ir;

        ssl_certificate /etc/nginx/ssl/fullchain-dn.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey-dn.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Healthcheck
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Static files
        location /img/categories/ {
            alias /var/www/categories/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /img/products/ {
            alias /var/www/products/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /img/prtalmb/ {
            alias /var/www/productalbum/;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Control Panel API
        location ^~ /cpi/ {
            proxy_pass http://controlpanel_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Techno API
        location ^~ /api/ {
            proxy_pass http://techno_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # React Frontend (IMPORTANT FIX)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Optional: cache static assets (better performance)
        location /assets/ {
            root /usr/share/nginx/html;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}