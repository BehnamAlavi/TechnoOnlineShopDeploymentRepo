events {}

http {
include       mime.types;
default_type  application/octet-stream;
sendfile on;

upstream frontend_upstream {
    server frontend:3000;
}

upstream techno_api {
    server techno-api:5000;
}

upstream controlpanel_api {
    server controlpanel-api:5000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name 5.160.219.141;

    location / {
        return 301 https://5.160.219.141$request_uri;
    }
}

# HTTPS server (IP-based)
server {
    listen 443 ssl;
    server_name 5.160.219.141;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

   location  /health {
    return 200 "OK";
    add_header Content-Type text/plain;
   }

    # Static files
    location /img/categories/ {
        alias /var/www/categories/;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /img/products/ {
        alias /var/www/products/;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /img/prtalmb/ {
        alias /var/www/productalbum/;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ControlPanel API
    location ^~ /cpi/ {
        proxy_pass http://controlpanel_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Techno API
    location ^~ /api/ {
        proxy_pass http://techno_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # React frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
}
