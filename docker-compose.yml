services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./data/categories:/var/www/categories:ro
      - ./data/products:/var/www/products:ro
      - ./data/productalbum:/var/www/productalbum:ro
    depends_on:
      - techno-api-service
      - controlpanel-api-service
      - frontend-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - techno-network

  techno-api-service:
    image: ghcr.io/${REGISTRY_OWNER}/technoshoponlinedeploy/techno-api:${TECHNO_API_VERSION:-1.0.0}
    container_name: techno-api
    volumes:
      - ./data/categories:/var/www/categories:ro
      - ./data/products:/var/www/products:ro
      - ./data/productalbum:/var/www/productalbum:ro
    environment:
      - SERVICE_NAME=techno-api
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__DefaultConnection=User ID=postgres;Password=${POSTGRES_PASSWORD};Host=postgres;Port=5432;Database=technoshopdb;
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - techno-network

  controlpanel-api-service:
    image: ghcr.io/${REGISTRY_OWNER}/technoshoponlinedeploy/controlpanel-api:${CONTROLPANEL_API_VERSION:-1.0.0}
    container_name: controlpanel-api
    volumes:
      - ./data/categories:/var/www/categories:rw
      - ./data/products:/var/www/products:rw
      - ./data/productalbum:/var/www/productalbum:rw
    environment:
      - SERVICE_NAME=controlpanel-api
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__DefaultConnection=User ID=postgres;Password=${POSTGRES_PASSWORD};Host=postgres;Port=5432;Database=technoshopdb;
    ports:
      - "5002:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - techno-network

  frontend-service:
    image: ghcr.io/${REGISTRY_OWNER}/technoshoponlinedeploy/frontend:${FRONTEND_VERSION:-1.0.0}
    container_name: frontend
    volumes:
    - ./dist:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    # environment:
    #   - REACT_APP_API_URL=http://${VPS_HOST:-localhost}:5001
    #   - REACT_APP_CONTROLPANEL_URL=http://${VPS_HOST:-localhost}:5002
    #   - NODE_ENV=${NODE_ENV:-production}
    # depends_on:
    #   - techno-api-service
    #   - controlpanel-api-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - techno-network

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: technoshopdb
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - techno-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - techno-network

volumes:
  postgres_data:
  redis_data:

networks:
  techno-network:
    driver: bridge
