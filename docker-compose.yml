services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./data/categories:/var/www/categories:ro
      - ./data/products:/var/www/products:ro
      - ./data/productalbum:/var/www/productalbum:ro
    depends_on:
      - techno-api-service
      - controlpanel-api-service
      - frontend-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - techno-network

  techno-api-service:
    image: ghcr.io/${REGISTRY_OWNER}/technoshoponlinedeploy/techno-api:${TECHNO_API_VERSION:-1.0.0}
    environment:
      SERVICE_NAME: techno-api
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=technoshopdb;Username=postgres;Password=${POSTGRES_PASSWORD}
    volumes:
      - ./data/categories:/var/www/categories:ro
      - ./data/products:/var/www/products:ro
      - ./data/productalbum:/var/www/productalbum:ro
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - techno-network

  controlpanel-api-service:
    image: ghcr.io/${REGISTRY_OWNER}/technoshoponlinedeploy/controlpanel-api:${CONTROLPANEL_API_VERSION:-1.0.0}
    environment:
      SERVICE_NAME: controlpanel-api
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=technoshopdb;Username=postgres;Password=${POSTGRES_PASSWORD}
    volumes:
      - ./data/categories:/var/www/categories:rw
      - ./data/products:/var/www/products:rw
      - ./data/productalbum:/var/www/productalbum:rw
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - techno-network

  frontend-service:
    image: ghcr.io/${REGISTRY_OWNER}/technoshoponlinedeploy/frontend:${FRONTEND_VERSION:-1.0.0}
    # volumes:
    #   - ./nginx-frontend.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    environment:
      CONTROLPANEL_API_URL: http://controlpanel-api-service:5000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - techno-network

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      POSTGRES_DB: technoshopdb
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql  #/var/lib/postgresql/data, this is for postgres lowe than version 18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - techno-network

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - techno-network

volumes:
  postgres_data:
  redis_data:

networks:
  techno-network:
    driver: bridge